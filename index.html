<script>
  const translations = {
    en: {
      home: "Home", about: "About Us", publications: "Publications", contact: "Contact", staff: "Staff Portal",
      heroTitle: "Securing National Interests Through Strategic Intelligence",
      heroDesc: "The Centre of National and External Intelligence delivers critical analysis, defense monitoring, and counter-threat coordination.",
      learnBtn: "Learn About CNEI", reportsBtn: "View Public Reports"
    },
    cy: {
      home: "Hafan", about: "Amdanom Ni", publications: "Cyhoeddiadau", contact: "Cysylltu", staff: "Porth Staff",
      heroTitle: "Diogelu Buddiannau Cenedlaethol Trwy Gwybodaeth Strategaethol",
      heroDesc: "Mae Cyngor Gwybodaeth Cenedlaethol ac Allanol yn darparu dadansoddiadau critigol a monitro amddiffyn.",
      learnBtn: "Dysgu am CNEI", reportsBtn: "Gweld Adroddiadau Cyhoeddus"
    },
    fr: {
      home: "Accueil", about: "À Propos", publications: "Publications", contact: "Contact", staff: "Portail du Personnel",
      heroTitle: "Garantir les Intérêts Nationaux par la Renseignement Stratégique",
      heroDesc: "Le Centre de Renseignement National et Externe fournit des analyses critiques et une surveillance de défense.",
      learnBtn: "En savoir plus sur le CNEI", reportsBtn: "Voir les Rapports Publics"
    },
    es: {
      home: "Inicio", about: "Sobre Nosotros", publications: "Publicaciones", contact: "Contacto", staff: "Portal del Personal",
      heroTitle: "Garantizando los Intereses Nacionales Mediante Inteligencia Estratégica",
      heroDesc: "El Centro de Inteligencia Nacional y Externa proporciona análisis críticos y monitoreo de defensa.",
      learnBtn: "Aprender sobre CNEI", reportsBtn: "Ver Informes Públicos"
    }
  };

  document.querySelectorAll('select[data-lang-selector]').forEach(select => {
    select.addEventListener('change', (e) => {
      const lang = e.target.value;
      const t = translations[lang] || translations.en;
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (t[key]) el.innerText = t[key];
      });
    });
  });
</script>
