<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CNEI — Staff Authentication</title>
  <link rel="icon" type="image/png" href="logo.png">
  <style>
    :root {
      --bg: #FFFFFF;
      --text: #111827;
      --border: #E5E7EB;
      --input-bg: #F9FAFB;
      --accent: #111827;
      --error: #DC2626;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .card {
      width: 100%;
      max-width: 400px;
      border: 1px solid var(--border);
      padding: 2.5rem;
      border-radius: 8px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02);
    }
    .logo-header { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.5rem; }
    .logo-header img { width: 28px; height: 28px; object-fit: contain; }
    .title { font-size: 1.1rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
    .subtitle { font-size: 0.8rem; color: #6B7280; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 2rem; }
    .field { margin-bottom: 1.25rem; }
    label { display: block; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.5rem; color: #374151; }
    input {
      width: 100%; padding: 0.75rem; font-size: 0.95rem;
      border: 1px solid var(--border); background-color: var(--input-bg);
      border-radius: 6px; outline: none; font-family: inherit;
    }
    input:focus { border-color: var(--accent); background-color: #FFF; }
    button {
      width: 100%; padding: 0.85rem; background-color: var(--accent);
      color: #FFF; border: none; font-size: 0.85rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.05em; border-radius: 6px; cursor: pointer;
      margin-top: 0.5rem; transition: opacity 0.15s;
    }
    button:hover { opacity: 0.9; }
    .err { margin-top: 1rem; font-size: 0.85rem; color: var(--error); display: none; text-align: center; }
  </style>
</head>
<body>

<div class="card">
  <div class="logo-header">
    <img src="logo.png" alt="Logo">
    <span class="title">CNEI Portal</span>
  </div>
  <div class="subtitle">Director Access Gateway</div>

  <form onsubmit="auth(event)">
    <div class="field">
      <label for="op">Operator ID</label>
      <input type="text" id="op" placeholder="e.g. cnei-admin" required autocomplete="off">
    </div>
    <div class="field">
      <label for="key">Clearance Key</label>
      <input type="password" id="key" placeholder="••••••••••••" required>
    </div>
    <button type="submit">Authenticate Session</button>
  </form>
  <div id="err" class="err">Invalid credentials provided.</div>
</div>

<script>
  function auth(e) {
    e.preventDefault();
    const op = document.getElementById('op').value.trim();
    const key = document.getElementById('key').value.trim();
    if ((key === 'CNEI-DIRECTOR-2026' || key === 'cnei-admin') && op.length > 0) {
      sessionStorage.setItem('cnei_authenticated', 'true');
      sessionStorage.setItem('cnei_operator_id', op);
      window.location.href = 'workspace.html';
    } else {
      document.getElementById('err').style.display = 'block';
    }
  }
</script>

</body>
</html>
