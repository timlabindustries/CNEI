<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CNEI — Staff Authentication Gateway</title>
  <link rel="icon" type="image/png" href="logo.png">
  <style>
    :root { --bg: #0B0F17; --card-bg: #1E293B; --border: #334155; --text: #F8FAFC; --muted: #94A3B8; --accent: #3B82F6; --error: #EF4444; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 1.5rem; }
    .card { width: 100%; max-width: 440px; background: var(--card-bg); border: 1px solid var(--border); padding: 2.5rem; border-radius: 8px; }
    .logo-header { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.5rem; }
    .logo-header img { width: 32px; height: 32px; }
    .title { font-size: 1.1rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; }
    .subtitle { font-size: 0.8rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 1.5rem; }
    .warning-box { background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); padding: 0.75rem; font-size: 0.75rem; color: #FCA5A5; border-radius: 4px; margin-bottom: 1.5rem; line-height: 1.4; }
    .field { margin-bottom: 1.25rem; }
    label { display: block; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.5rem; color: var(--muted); }
    input { width: 100%; padding: 0.75rem; font-size: 0.95rem; border: 1px solid var(--border); background: #0F172A; color: #FFF; border-radius: 6px; outline: none; }
    input:focus { border-color: var(--accent); }
    button { width: 100%; padding: 0.85rem; background: var(--accent); color: #FFF; border: none; font-size: 0.85rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; border-radius: 6px; cursor: pointer; margin-top: 0.5rem; }
    button:hover { opacity: 0.9; }
    .err { margin-top: 1rem; font-size: 0.85rem; color: var(--error); display: none; text-align: center; }
  </style>
</head>
<body>

<div class="card">
  <div class="logo-header">
    <img src="logo.png" alt="">
    <span class="title">CNEI Staff Portal</span>
  </div>
  <div class="subtitle">Secure Authentication Gateway</div>

  <div class="warning-box">
    ⚠️ <strong>WARNING:</strong> Unauthorized access to this system is strictly prohibited under the Computer Misuse Act 1990 and international statutes. All connection attempts and operational activities are monitored and logged.
  </div>

  <form onsubmit="handleLogin(event)">
    <div class="field">
      <label for="op">Staff Operator ID</label>
      <input type="text" id="op" placeholder="e.g. staff-operator-1" required autocomplete="off">
    </div>
    <div class="field">
      <label for="key">Clearance Passcode</label>
      <input type="password" id="key" placeholder="••••••••••••" required>
    </div>
    <button type="submit">Authenticate Staff Session</button>
  </form>
  <div id="err" class="err">Invalid credentials provided.</div>
</div>

<script>
  function handleLogin(e) {
    e.preventDefault();
    const op = document.getElementById('op').value.trim();
    const key = document.getElementById('key').value.trim();
    if ((key === 'CNEI-DIRECTOR-2026' || key === 'cnei-admin' || key.startsWith('CNEI-STAFF')) && op.length > 0) {
      sessionStorage.setItem('cnei_authenticated', 'true');
      sessionStorage.setItem('cnei_operator_id', op);
      window.location.href = 'workspace.html';
    } else {
      document.getElementById('err').style.display = 'block';
    }
  }
</script>
</body>
</html>
