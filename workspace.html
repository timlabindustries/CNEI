<!-- Load Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
  if (sessionStorage.getItem('cnei_authenticated') !== 'true') {
    window.location.href = 'login.html';
  }

  // Your CNEI Firebase Configuration
  const firebaseConfig = {
    apiKey: "AIzaSyC3Pq29bAViHJOMq4CyxRx092u7vrJJLVk",
    authDomain: "cnei-system.firebaseapp.com",
    databaseURL: "https://cnei-system-default-rtdb.firebaseio.com",
    projectId: "cnei-system",
    storageBucket: "cnei-system.firebasestorage.app",
    messagingSenderId: "55065590531",
    appId: "1:55065590531:web:75d3f071512507c2aa8736"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const currentOperator = sessionStorage.getItem('cnei_operator_id') || 'cnei-admin';

  let audioContext = null;
  let alertInterval = null;

  function playStaffAlarm() {
    try {
      if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
      if (audioContext.state === 'suspended') audioContext.resume();
      const osc = audioContext.createOscillator();
      const gain = audioContext.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(880, audioContext.currentTime);
      gain.gain.setValueAtTime(0.15, audioContext.currentTime);
      osc.connect(gain);
      gain.connect(audioContext.destination);
      osc.start();
      osc.stop(audioContext.currentTime + 0.15);
    } catch (e) {
      console.warn("Audio waiting for user gesture.");
    }
  }

  // Real-time synchronization for staff panel & warning LED/alarm
  db.ref('system/lockdown').on('value', (snapshot) => {
    const data = snapshot.val();
    const active = data && data.active;
    const led = document.getElementById('sys-led');
    const btn = document.getElementById('lockdownBtn');

    if (active) {
      if (led) led.classList.add('lockdown');
      if (btn) {
        btn.innerText = 'TERMINATE GLOBAL LOCKDOWN';
        btn.style.backgroundColor = 'var(--red-alert, #DC2626)';
        btn.style.color = '#FFFFFF';
      }

      if (!alertInterval) {
        playStaffAlarm();
        alertInterval = setInterval(playStaffAlarm, 1200);
      }
    } else {
      if (led) led.classList.remove('lockdown');
      if (btn) {
        btn.innerText = 'INITIATE GLOBAL LOCKDOWN';
        btn.style.backgroundColor = 'transparent';
        btn.style.color = 'var(--red-alert, #DC2626)';
      }

      if (alertInterval) {
        clearInterval(alertInterval);
        alertInterval = null;
      }
    }
  });

  // Real-time listener for central audit logs
  db.ref('audit_logs').limitToLast(15).on('child_added', (snapshot) => {
    const log = snapshot.val();
    const feed = document.getElementById('feedBox');
    if (feed) {
      const entry = document.createElement('div');
      entry.className = 'feed-entry';
      entry.innerHTML = `<span class="feed-timestamp">[${log.timestamp}]</span> <strong>${log.operator}</strong>: ${log.action} ("${log.details}")`;
      feed.prepend(entry);
    }
  });

  // Global Lockdown toggle function triggered by the staff button
  function toggleGlobalLockdown() {
    db.ref('system/lockdown').once('value').then((snapshot) => {
      const data = snapshot.val();
      const currentState = data && data.active;
      const newState = !currentState;
      const inputEl = document.getElementById('broadcastMsg');
      const customMsg = (inputEl && inputEl.value) ? inputEl.value : "CONDITION RED: All public operations suspended by Director mandate.";
      const timeStr = new Date().toISOString().replace('T', ' ').substr(0, 19);

      // Send status to Firebase
      db.ref('system/lockdown').set({
        active: newState,
        message: customMsg,
        triggeredBy: currentOperator,
        timestamp: timeStr
      });

      // Write action to audit log tree
      db.ref('audit_logs').push({
        operator: currentOperator,
        action: newState ? "INITIATED_LOCKDOWN" : "TERMINATED_LOCKDOWN",
        details: customMsg,
        timestamp: timeStr
      });
    });
  }

  function updateClock() {
    const clock = document.getElementById('sys-clock');
    if (clock) clock.innerText = 'UTC ' + new Date().toISOString().substr(11, 8);
  }
  setInterval(updateClock, 1000);
  updateClock();
</script>
