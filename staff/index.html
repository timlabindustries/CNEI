<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CNEI Staff Command Console</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans flex flex-col">

  <!-- COMMAND HEADER -->
  <header class="bg-slate-900 border-b border-slate-800 px-6 py-4 flex justify-between items-center">
    <div class="flex items-center space-x-3">
      <span class="bg-red-700 text-white font-black text-sm px-2 py-1 rounded">STAFF</span>
      <h1 class="font-bold text-slate-200">CNEI Tactical Command Panel</h1>
    </div>
    <div id="status-badge" class="text-xs px-3 py-1 rounded-full bg-emerald-950 text-emerald-400 border border-emerald-800">
      SYSTEM STATUS: NORMAL
    </div>
  </header>

  <main class="flex-1 p-6 grid lg:grid-cols-3 gap-6 max-w-7xl mx-auto w-full">
    
    <!-- LEFT CONTROL PANEL -->
    <div class="space-y-6">
      
      <!-- LOCKDOWN CONTROLS -->
      <div class="bg-slate-900 border border-red-900/50 rounded-xl p-6 space-y-4">
        <h2 class="text-red-400 font-bold flex items-center text-lg">
          <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
          Emergency Lockdown Directive
        </h2>
        
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Lockdown Reason / Public Message</label>
          <input type="text" id="lockdown-msg-input" placeholder="Enter emergency notice..." class="w-full bg-slate-950 border border-slate-800 rounded px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-red-600">
        </div>

        <div id="countdown-panel" class="hidden bg-red-950/50 border border-red-800 p-4 rounded-lg text-center">
          <p class="text-xs text-red-300 uppercase tracking-widest mb-1">Initiating System Lockdown In</p>
          <p id="countdown-timer" class="text-4xl font-black text-red-500 font-mono">9</p>
          <button id="cancel-btn" onclick="cancelCountdown()" class="mt-2 text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1 rounded">Abort Protocol</button>
        </div>

        <div class="flex space-x-3">
          <button id="trigger-btn" onclick="startLockdownSequence()" class="flex-1 bg-red-700 hover:bg-red-600 text-white font-bold py-2 px-4 rounded text-sm transition">
            Trigger Lockdown
          </button>
          <button id="unlock-btn" onclick="unlockSystem()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-2 px-4 rounded text-sm transition">
            Restore
          </button>
        </div>
      </div>

    </div>

    <!-- RIGHT EMBEDDED MONITORING MODULES -->
    <div class="lg:col-span-2 space-y-6">
      
      <!-- GOOGLE MAPS EMBED -->
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-4">
        <h3 class="text-sm font-semibold text-slate-300 mb-3">Global Tactical Mapping (Google Maps)</h3>
        <div class="h-64 rounded-lg overflow-hidden border border-slate-800">
          <iframe class="w-full h-full" src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d2482.888!2d-0.1276!3d51.5074!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2suk!4v1" loading="lazy"></iframe>
        </div>
      </div>

      <!-- VENTUSKY WEATHER MONITOR EMBED -->
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-4">
        <h3 class="text-sm font-semibold text-slate-300 mb-3">Weather Monitor (Ventusky)</h3>
        <div class="h-64 rounded-lg overflow-hidden border border-slate-800">
          <iframe class="w-full h-full" src="https://www.ventusky.com/"></iframe>
        </div>
      </div>

      <!-- VESSEL FINDER EMBED -->
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-4">
        <h3 class="text-sm font-semibold text-slate-300 mb-3">Maritime Tracking (VesselFinder)</h3>
        <div class="h-64 rounded-lg overflow-hidden border border-slate-800">
          <iframe class="w-full h-full" src="https://www.vesselfinder.com/embed"></iframe>
        </div>
      </div>

    </div>

  </main>

  <script>
    const firebaseConfig = {
      databaseURL: "https://cnei-default-rtdb.firebaseio.com" // Update with your Firebase Realtime DB URL
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const lockdownRef = db.ref('system/lockdown');

    const alarm = new Audio('alarm.mp3');
    alarm.loop = true;

    let countdownInterval = null;
    let secondsLeft = 9;

    function startLockdownSequence() {
      if (countdownInterval) return;
      
      secondsLeft = 9;
      document.getElementById('countdown-timer').textContent = secondsLeft;
      document.getElementById('countdown-panel').classList.remove('hidden');
      
      // Start alarm ONLY during countdown
      alarm.currentTime = 0;
      alarm.play().catch(err => console.log('Audio playback permission required:', err));

      countdownInterval = setInterval(() => {
        secondsLeft--;
        document.getElementById('countdown-timer').textContent = secondsLeft;

        if (secondsLeft <= 0) {
          clearInterval(countdownInterval);
          countdownInterval = null;
          document.getElementById('countdown-panel').classList.add('hidden');
          
          // Stop audio immediately when countdown ends
          alarm.pause();
          alarm.currentTime = 0;

          const msg = document.getElementById('lockdown-msg-input').value || "ALL PUBLIC SERVICES SUSPENDED BY CNEI DIRECTORATE";
          lockdownRef.set({ isLocked: true, message: msg, timestamp: Date.now() });
        }
      }, 1000);
    }

    function cancelCountdown() {
      if (countdownInterval) {
        clearInterval(countdownInterval);
        countdownInterval = null;
      }
      document.getElementById('countdown-panel').classList.add('hidden');
      
      // Stop audio immediately when canceled
      alarm.pause();
      alarm.currentTime = 0;
    }

    function unlockSystem() {
      cancelCountdown();
      lockdownRef.set({ isLocked: false, message: "", timestamp: Date.now() });
    }

    // Monitor status to update badge
    lockdownRef.on('value', (snapshot) => {
      const data = snapshot.val();
      const badge = document.getElementById('status-badge');
      if (data && data.isLocked) {
        badge.textContent = "SYSTEM STATUS: LOCKDOWN ACTIVE";
        badge.className = "text-xs px-3 py-1 rounded-full bg-red-950 text-red-400 border border-red-800 font-bold animate-pulse";
      } else {
        badge.textContent = "SYSTEM STATUS: NORMAL";
        badge.className = "text-xs px-3 py-1 rounded-full bg-emerald-950 text-emerald-400 border border-emerald-800";
      }
    });
  </script>
</body>
</html>
