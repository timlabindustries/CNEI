<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | CNEI</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .form-group {
            margin-bottom: 1.5rem;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--primary-blue);
        }
        input, textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 1rem;
            font-family: inherit;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: var(--brand-green);
        }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <a href="index.html" class="logo-container">
                <img src="logo1.jpeg" alt="CNEI Logo">
                <span class="logo-text">CNEI</span>
            </a>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="research.html">Research & Briefs</a></li>
                    <li><a href="contact.html" class="active">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="container" style="max-width: 600px;">
        <h2>Contact CNEI</h2>
        <p style="color: var(--text-muted); margin-bottom: 2rem;">Have questions regarding our research or want to get in touch with our team? Send us a message below.</p>
        
        <!-- Action points directly to info@cnei.org.uk using a standard mail client fallback or can be connected to a form handler service -->
        <form action="mailto:info@cnei.org.uk" method="POST" enctype="text/plain">
            <div class="form-group">
                <label for="name">Your Name</label>
                <input type="text" id="name" name="name" required placeholder="Enter your name">
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required placeholder="name@example.com">
            </div>
            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" name="message" rows="5" required placeholder="Type your message here..."></textarea>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; cursor: pointer; border: none;">Send Message to info@cnei.org.uk</button>
        </form>
    </div>

    <footer>
        <div class="footer-content">
            <div class="logo-container">
                <img src="logo1.jpeg" alt="CNEI Logo" style="height: 35px;">
                <span class="logo-text" style="font-size: 1rem;">CNEI</span>
            </div>
            <div class="footer-links">
                <a href="legal.html">Legal Centre</a>
            </div>
        </div>
        <div class="copyright">
            &copy; 2026 Coalition of Nuclear Energy Initiatives (CNEI). All rights reserved.
        </div>
    </footer>

</body>
</html>
