<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CNEI — Staff Authentication</title>
  <style>
    :root {
      --bg-color: #FFFFFF;
      --text-main: #000000;
      --border-color: #E5E7EB;
      --input-bg: #F9FAFB;
      --accent: #111827;
      --red-alert: #DC2626;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .login-card {
      width: 100%;
      max-width: 380px;
      border: 1px solid var(--border-color);
      padding: 2.5rem;
      border-radius: 6px;
    }
    .header-logo {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      margin-bottom: 0.25rem;
      text-transform: uppercase;
    }
    .header-sub {
      font-size: 0.8rem;
      color: #6B7280;
      margin-bottom: 2rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .form-group {
      margin-bottom: 1.25rem;
    }
    label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.5rem;
      color: #374151;
    }
    input {
      width: 100%;
      padding: 0.75rem;
      font-size: 0.9rem;
      border: 1px solid var(--border-color);
      background-color: var(--input-bg);
      border-radius: 4px;
      outline: none;
      font-family: inherit;
    }
    input:focus {
      border-color: var(--accent);
      background-color: #FFFFFF;
    }
    button {
      width: 100%;
      padding: 0.75rem;
      background-color: var(--accent);
      color: #FFFFFF;
      border: none;
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 0.5rem;
    }
    button:hover { opacity: 0.9; }
    .error-message {
      margin-top: 1rem;
      font-size: 0.8rem;
      color: var(--red-alert);
      display: none;
      text-align: center;
    }
  </style>
</head>
<body>

<div class="login-card">
  <div class="header-logo">CNEI Portal</div>
  <div class="header-sub">Director Access Terminal</div>

  <form id="loginForm" onsubmit="handleLogin(event)">
    <div class="form-group">
      <label for="operator">Operator ID</label>
      <input type="text" id="operator" placeholder="e.g. cnei-admin" required autocomplete="off">
    </div>
    <div class="form-group">
      <label for="passcode">Clearance Key</label>
      <input type="password" id="passcode" placeholder="••••••••••••" required>
    </div>
    <button type="submit">Authenticate</button>
  </form>

  <div id="error" class="error-message">Invalid Operator ID or Clearance Key.</div>
</div>

<script>
  function handleLogin(e) {
    e.preventDefault();
    const op = document.getElementById('operator').value.trim();
    const key = document.getElementById('passcode').value.trim();
    const errEl = document.getElementById('error');

    // Valid passcodes: CNEI-DIRECTOR-2026 or cnei-admin
    if ((key === 'CNEI-DIRECTOR-2026' || key === 'cnei-admin') && op.length > 0) {
      sessionStorage.setItem('cnei_authenticated', 'true');
      sessionStorage.setItem('cnei_operator_id', op);
      window.location.href = 'workspace.html';
    } else {
      errEl.style.display = 'block';
    }
  }
</script>

</body>
</html>
